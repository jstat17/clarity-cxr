[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-cxr"
version = "1.0.0"
description = "Code companion to CLARiTy: A Vision Transformer for Multi-Label Classification and Weakly-Supervised Localization of Chest X-ray Pathologies"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "John Statheros" }]
dependencies = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "timm==1.0.11",
  "numpy==2.1.1",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "scikit-image==0.24.0",
  "opencv-python-headless==4.10.0.84",
  "scipy==1.14.1",
  "natsort==8.4.0",
  "tqdm==4.66.5",
  "numba==0.67.0",
  "Pillow==10.4.0",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "ml-dtypes==0.6.0",
]

[project.optional-dependencies]
data = ["torchxrayvision==1.5.7"]
# RSNA / VinDr-CXR transfer study: HiResCAM, the external baselines (TorchXRayVision,
# RAD-DINO) and the DICOM header fallback of the VinDr reader
transfer = [
  "torchxrayvision==1.5.7",
  "grad-cam==1.5.5",
  "transformers==4.57.6",
  "huggingface-hub==0.36.2",
  "pydicom==3.0.1",
]

[project.scripts]
clarity-train = "clarity.cli.train:main"
clarity-evaluate = "clarity.cli.evaluate:main"
clarity-predict = "clarity.cli.predict:main"
clarity-segment = "clarity.cli.segment:main"
clarity-prepare = "clarity.cli.prepare_masks:main"
clarity-baselines = "clarity.cli.baselines:main"

[tool.uv]
# grad-cam requires the full opencv-python wheel; the project pins
# opencv-python-headless, and two cv2 distributions in one environment overwrite
# each other's files. The override removes that requirement; headless provides cv2.
override-dependencies = ["opencv-python ; python_version < '0'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E701", "E702", "E741", "E731", "F841", "F811", "F402"]
